/*
 * AI Interview Platform - Backend Application
 * Spring Boot 4.1 + Java 25 + Spring AI 2.0 + PostgreSQL + pgvector + RustFS + Redis
 */

plugins {
    id 'java'
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
}

group = 'com.interview'
version = '1.0.0-SNAPSHOT'

repositories {
    maven { url = uri('https://maven.aliyun.com/repository/public/') }
    maven { url = uri('https://maven.aliyun.com/repository/spring/') }
    maven { url = uri('https://maven.aliyun.com/repository/gradle-plugin/') }
    mavenCentral()
    maven { url = uri('https://repo.spring.io/milestone') }
}

dependencies {
    // Spring Boot Starters (Boot 4 modular design)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'

    // PostgreSQL
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // H2 Database for testing
    testRuntimeOnly 'com.h2database:h2'

    // spring-ai-agent-utils BOM (version alignment)
    implementation platform(libs.spring.ai.agent.utils.bom)

    // Spring AI 2.0 - OpenAI兼容模式 (阿里云DashScope)
    implementation "org.springframework.ai:spring-ai-starter-model-openai:${libs.versions.springAi.get()}"
    // Spring AI 2.0 - Anthropic Messages API (官方 anthropic-java SDK 适配)
    implementation "org.springframework.ai:spring-ai-starter-model-anthropic:${libs.versions.springAi.get()}"
    // anthropic-java OkHttp 客户端实现（spring-ai-anthropic 只带 core，/v1/models 列表拉取需要完整客户端）
    implementation 'com.anthropic:anthropic-java-client-okhttp:2.40.1'
    // Spring AI 2.0 - PostgreSQL Vector Store (pgvector)
    implementation "org.springframework.ai:spring-ai-starter-vector-store-pgvector:${libs.versions.springAi.get()}"
    // spring-ai-agent-utils core library
    implementation libs.spring.ai.agent.utils

    // Apache Tika for document parsing (PDF, DOCX, TXT)
    implementation libs.tika.core
    implementation libs.tika.parsers

    // AWS S3 SDK for RustFS storage
    implementation "software.amazon.awssdk:s3:${libs.versions.aws.sdk.get()}"

    // Pinyin4j - 汉字转拼音
    implementation libs.pinyin4j

    // SpringDoc OpenAPI - Swagger接口文档
    implementation libs.springdoc

    // Redisson 4.0 - Redis客户端 (Boot 4 compatible)
    implementation "org.redisson:redisson-spring-boot-starter:${libs.versions.redisson.get()}"

    // Prometheus metrics endpoint for Actuator
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // PDF导出 - iText 8
    implementation "com.itextpdf:itext-core:${libs.versions.itext.get()}"
    implementation "com.itextpdf:font-asian:${libs.versions.itext.get()}"

    // Aliyun DashScope SDK for Qwen3 ASR/TTS (replaces NLS SDK)
    implementation('com.alibaba:dashscope-sdk-java:2.22.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple' // 使用 Spring Boot 的 Logback
    }

    // Jakarta annotation for Java 21+ (replaces javax.annotation)
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Lombok
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // MapStruct - 对象映射 (必须在Lombok之后配置)
    implementation "org.mapstruct:mapstruct:${libs.versions.mapstruct.get()}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${libs.versions.mapstruct.get()}"
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.junit.jupiter
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 全局UTF-8编码配置
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// 将仓库根目录 .env 注入 bootRun，便于本地加载 POSTGRES_*/REDIS_*/APP_STORAGE_* 等基础设施变量
// （Gradle 进程默认不读 .env）。AI 相关配置不在此列，全部在「设置」页内完成。
// 同时确保 JVM 使用 UTF-8 编码
tasks.named('bootRun') {
    // 与 run.bat 对齐：工作目录设为仓库根、日志写相对路径 logs/app.log。
    // bootRun 默认工作目录是 app/，若不改，相对路径会落到 app/logs/app.log。
    workingDir = rootProject.projectDir
    // JVM 编码配置（stdout/stderr：JDK 18+，避免控制台 PrintStream 与 Logback UTF-8 不一致）
    // 日志写入仓库根 logs/app.log，与 run.bat 的 -Dlogging.file.name=logs/app.log 保持一致。
    // 不配置时 Spring Boot 只打印到控制台，手工重定向容易散落进系统临时目录。
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dconsole.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
            '--enable-native-access=ALL-UNNAMED',
            '-Dlogging.file.name=logs/app.log'
    ]

    // 加载 .env 文件
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            def val = trimmed.substring(eq + 1).trim()
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}

// 前端产物：bootJar 前用 pnpm 重新构建 frontend/dist，并 Sync 到 static（旧 hash bundle 自动清除）。
// buildFrontend 声明了 inputs/outputs，前端源码没变时 Gradle 会跳过重复的 pnpm build。
def frontendDir = rootProject.file('frontend')
def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')

tasks.register('buildFrontend', Exec) {
    workingDir = frontendDir
    if (isWindows) {
        commandLine 'cmd.exe', '/c', 'pnpm.cmd', 'run', 'build'
    } else {
        commandLine 'pnpm', 'run', 'build'
    }
    inputs.dir new File(frontendDir, 'src')
    inputs.files new File(frontendDir, 'package.json'), new File(frontendDir, 'pnpm-lock.yaml'),
        new File(frontendDir, 'vite.config.ts'), new File(frontendDir, 'tsconfig.json')
    outputs.dir new File(frontendDir, 'dist')
}

tasks.register('syncFrontendStatic', Sync) {
    dependsOn 'buildFrontend'
    from new File(frontendDir, 'dist')
    into layout.projectDirectory.dir('src/main/resources/static')
}

// bootJar 同时依赖 processResources 与 syncFrontendStatic，强制先同步再拷贝资源，避免并行竞态
tasks.named('processResources') {
    mustRunAfter 'syncFrontendStatic'
}

// 生产打包：固定可执行 Jar 名称，便于一键启动脚本引用（app/build/libs/app.jar）
tasks.named('bootJar') {
    dependsOn 'syncFrontendStatic'
    archiveFileName = 'app.jar'
}
