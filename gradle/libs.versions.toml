# AI Interview Platform - Dependency Management

[versions]
spring-boot = "4.1.0"
springAi = "2.0.0"
springAiAgentUtils = "0.10.0"
tika = "2.9.2"
lombok = "1.18.46"
redisson = "4.0.0"
mapstruct = "1.6.3"
aws-sdk = "2.29.51"
itext = "8.0.5"
pinyin4j = "2.5.0"
springdoc = "3.0.2"
# Sa-Token 认证框架（1.46.0 起提供 Spring Boot 4 适配 starter，JDK 8~25）
sa-token = "1.46.0"

[libraries]
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-parsers = { module = "org.apache.tika:tika-parsers-standard-package", version.ref = "tika" }
pinyin4j = { module = "com.belerweb:pinyin4j", version.ref = "pinyin4j" }
springdoc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
spring-ai-agent-utils-bom = { module = "org.springaicommunity:spring-ai-agent-utils-bom", version.ref = "springAiAgentUtils" }
spring-ai-agent-utils = { module = "org.springaicommunity:spring-ai-agent-utils" }
sa-token-spring-boot4-starter = { module = "cn.dev33:sa-token-spring-boot4-starter", version.ref = "sa-token" }
sa-token-redisson = { module = "cn.dev33:sa-token-redisson", version.ref = "sa-token" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
